name: Local-first code checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q therapybot
      - run: python -m unittest discover -s tests -v
      # Browser smoke needs external Puppeteer/installed Edge; keep these
      # dependency-free JS contracts in every Windows/Linux CI job.
      - name: Verify local conversation, DOM and Vault JS contracts
        run: node --test tests/test_conversation_adapter.cjs tests/test_adapter_dom_smoke.cjs tests/test_vault_ui_lock.cjs
      - run: python scripts/validate_research.py
