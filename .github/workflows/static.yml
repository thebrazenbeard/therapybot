# Publish the public preview only. Never publish the local runtime UI or data.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify public preview allowlist
        run: python -m unittest discover -s tools/pages_publish_tests -p 'test_*.py' -v
      - name: Stage reviewed informational pages only
        run: python tools/pages_publish_tests/stage_public.py --source pages --destination "${{ runner.temp }}/therapybot-public-pages"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Explicit allowlist: index.html, interface-preview.html, interface-preview.css.
          # NEVER upload pages/lab/ or other experimental assets by directory recursion.
          path: '${{ runner.temp }}/therapybot-public-pages'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
